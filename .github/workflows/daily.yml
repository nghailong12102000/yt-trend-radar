name: Daily Trend Radar

on:
  schedule:
    # 06:00 UTC = 13:00 giờ VN. Chạy sau khi Mỹ đã hết ngày.
    - cron: "0 6 * * *"
  workflow_dispatch:      # cho phép bấm chạy tay để test

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch trending
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python fetch.py

      - name: Score
        run: python score.py

      - name: Extract keywords
        run: python keywords.py

      # Xuất CSV ra đường dẫn cố định để Google Sheets tự kéo bằng IMPORTDATA.
      # Không cần xác thực Google.
      - name: Export CSV
        run: python export_csv.py

      - name: Commit snapshot
        run: |
          git config user.name  "trend-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Không có dữ liệu mới, bỏ qua."
            exit 0
          fi
          git commit -m "radar: $(date -u +%F)"
          # Repo có thể đã thay đổi trong lúc workflow chạy (5-6 phút).
          # Kéo về rồi thử lại tối đa 3 lần thay vì fail ngay.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin ${{ github.ref_name }} \
               && git push origin HEAD:${{ github.ref_name }}; then
              echo "Đã đẩy dữ liệu lên thành công."
              exit 0
            fi
            echo "Lần $i thất bại, thử lại sau 5 giây..."
            sleep 5
          done
          echo "Không đẩy được sau 3 lần thử."
          exit 1
